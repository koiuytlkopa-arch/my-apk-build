<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e16">
<title>Nexus</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-t="dark">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <symbol id="logo" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="url(#lg)"/><polygon points="30,72 30,30 39,30 39,72" fill="#fff"/><polygon points="63,72 63,30 72,30 72,72" fill="#fff"/><polygon points="30,30 39,30 72,72 63,72" fill="#c7d0ff"/><circle cx="74" cy="25" r="6" fill="#6ee7b7"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="6" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="19" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <button class="ib" id="bm" aria-label="المحادثات"><svg><use href="#i-menu"/></svg></button>
    <div class="brand">
      <svg class="logo"><use href="#logo"/></svg>
      <div class="bt"><b id="tt">Nexus</b><small id="st"><i id="dot"></i><span id="stx">جاهز</span></small></div>
    </div>
    <button class="ib" id="bp" aria-label="معاينة"><svg><use href="#i-eye"/></svg></button>
    <button class="ib" id="bs" aria-label="الإعدادات"><svg><use href="#i-gear"/></svg></button>
  </header>

  <main>
    <section class="v on" id="v-chat">
      <div id="chat"></div>
      <div class="composer">
        <textarea id="in" rows="1" placeholder="اكتب مهمتك…" enterkeyhint="send"></textarea>
        <button class="send" id="send" aria-label="إرسال"><svg><use href="#i-send"/></svg></button>
      </div>
    </section>
    <section class="v" id="v-files"><div class="lst" id="fl"></div><div class="composer one"><button class="go wide" id="nf"><svg class="s"><use href="#i-plus"/></svg> ملف جديد</button></div></section>
    <section class="v" id="v-plan"><div class="lst" id="pl"></div></section>
    <section class="v" id="v-audit"><div class="lst" id="al"></div></section>
  </main>

  <nav class="tabs">
    <button data-v="chat" class="on"><svg><use href="#i-chat"/></svg><span>محادثة</span></button>
    <button data-v="files"><svg><use href="#i-file"/></svg><span>ملفات</span></button>
    <button data-v="plan"><svg><use href="#i-list"/></svg><span>الخطة</span></button>
    <button data-v="audit"><svg><use href="#i-shield"/></svg><span>السجل</span></button>
  </nav>
</div>

<!-- لوحات -->
<div class="pn drawer" id="pd">
  <header class="top"><b class="grow">المحادثات</b><button id="ns" class="go sm"><svg class="s"><use href="#i-plus"/></svg> جديدة</button><button class="ib" data-close><svg><use href="#i-x"/></svg></button></header>
  <div class="b" id="sl"></div>
</div>

<div class="pn" id="pe">
  <header class="top"><b class="grow ltr" id="ep"></b><button class="ib" id="erun" aria-label="تشغيل">▶</button><button class="ib" id="epv" aria-label="معاينة"><svg><use href="#i-eye"/></svg></button><button class="ib" id="eps" aria-label="مشاركة"><svg><use href="#i-share"/></svg></button><button class="ib" id="edl" aria-label="حذف"><svg><use href="#i-trash"/></svg></button><button class="go sm" id="esv">حفظ</button></header>
  <textarea id="et" spellcheck="false"></textarea>
</div>

<div class="pn" id="pv">
  <header class="top"><b class="grow" id="pvt">المعاينة</b><button class="ib" id="pvs" aria-label="حفظ/مشاركة"><svg><use href="#i-share"/></svg></button><button class="ib" data-close><svg><use href="#i-x"/></svg></button></header>
  <iframe id="fr" sandbox="allow-scripts" title="معاينة"></iframe>
</div>

<div class="pn" id="ps">
  <header class="top"><b class="grow">الإعدادات</b><button class="ib" data-close><svg><use href="#i-x"/></svg></button></header>
  <div class="b set">
    <h4>النموذج</h4>
    <label>المزوّد</label>
    <select id="prv">
      <option value="auto">Nexus Brain — يدير كل المزوّدين تلقائياً (موصى به)</option>
      <option value="openai">متوافق مع OpenAI — بمفتاحك</option>
      <option value="gemini">Gemini — بمفتاحك</option>
      <option value="device">النموذج المحلي فقط — يعمل على جهازك بلا إنترنت</option>
      <option value="pro">Nexus Pro — إجابات متصلة بالإنترنت، بلا نموذج خارجي ولا مفاتيح</option>
      <option value="local">Nexus Core — بدون إنترنت (أوامر بسيطة)</option>
    </select>
    <div id="g-auto"><label>توكن LLM7 (اختياري — يرفع الحد من 30 إلى 120 طلب/دقيقة)</label><input id="llm7" type="password" dir="ltr" placeholder="من token.llm7.io — مجاني"></div>
    <div id="g-brain"></div>
    <div id="g-key"><label>المفتاح</label><input id="key" type="password" dir="ltr"></div>
    <div id="g-model"><label>النموذج</label><input id="model" dir="ltr" placeholder="gpt-4o-mini / gemini-2.5-flash …"></div>
    <div id="g-base"><label>Base URL</label><input id="base" dir="ltr"></div>
    <small class="hint" id="privacy">⚠ في الوضع المجاني تُرسل رسائلك ونتائج الأدوات إلى مزوّد خارجي (LLM7). لا تشارك معه أسراراً أو بيانات حساسة.</small>

    <h4>النموذج على الجهاز</h4>
    <small class="hint" id="dv-st"></small>
    <input id="dv-url" dir="ltr" placeholder="رابط نموذج .litertlm">
    <input id="dv-tok" type="password" dir="ltr" placeholder="توكن Hugging Face (للنماذج المقيّدة مثل Gemma)">
    <button id="dv-go">⬇ تنزيل وتشغيل النموذج المحلي</button>

    <h4>السلوك والأمان</h4>
    <label>الصلاحيات</label>
    <select id="auto"><option value="safe">آمن: اطلب موافقتي للعمليات الحساسة</option><option value="auto">مستقل: نفّذ كل شيء بدون سؤال (خطر)</option></select>
    <label>تخصص الوكيل</label>
    <select id="role"><option value="general">عام</option><option value="dev">مهندس برمجيات</option><option value="research">باحث</option><option value="analyst">محلل بيانات</option></select>
    <button id="pin">🔒 تعيين رمز قفل للتطبيق</button>
    <small class="hint">القفل يمنع الفضول العابر فقط؛ البيانات غير مشفّرة داخل الجهاز.</small>

    <h4>المظهر</h4>
    <select id="theme"><option value="dark">داكن</option><option value="light">فاتح</option></select>

    <h4>البيانات</h4>
    <label>التعلّم الذاتي (محلي بالكامل: يتعلّم أفضل مزوّد، يحفظ دروساً، ويجمع بيانات تدريب)</label><select id="learn"><option value="on">مفعّل</option><option value="off">متوقف</option></select>
    <small class="hint" id="g-stats" style="white-space:pre-wrap"></small>
    <button id="exd">⬇ تصدير بيانات تدريب نموذجك (JSONL)</button>
    <button class="go" id="sv">حفظ الإعدادات</button>
    <button id="ex">⬇ نسخة احتياطية (حفظ/مشاركة)</button>
    <label>استعادة نسخة</label><input type="file" id="im" accept=".json">
    <button id="lk">قفل التطبيق الآن</button>
    <small class="hint">Nexus v11</small>
  </div>
</div>

<div class="lock" id="lock">
  <svg class="big"><use href="#logo"/></svg>
  <h1>NEXUS</h1>
  <input id="lgp" type="password" inputmode="numeric" placeholder="رمز القفل" autocomplete="off">
  <div id="lge"></div>
  <button class="go wide" id="lgb">فتح</button>
</div>

<div class="modal" id="md"></div>
<div id="toasts"></div>

<script src="native.js"></script>
<script src="core.js"></script>
<script src="tools.js"></script>
<script src="llm.js"></script>
<script src="brain.js"></script>
<script src="learn.js"></script>
<script src="search.js"></script>
<script src="pro.js"></script>
<script src="dev.js"></script>
<script src="ui.js"></script>
</body>
</html>
