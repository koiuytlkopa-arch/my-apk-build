name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build
        working-directory: .
        run: |
          gradle -p __apk__ assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path '*outputs*' -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo 'no apk found'; exit 1; }
          cp "$APK" app.apk
          gh release create "v${{ github.run_number }}" app.apk --title "Build ${{ github.run_number }}" --notes APK --latest
